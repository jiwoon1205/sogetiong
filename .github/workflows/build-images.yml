# main에 푸시하면 GitHub가 서버용 Docker 이미지를 대신 만들어서 GitHub 저장소(ghcr.io)에 올려둔다.
# 서버(메모리 1GB)는 빌드하지 않고 완성된 이미지를 내려받기만 한다 → 12_DEPLOYMENT.md 4장
name: build-images

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "web/**"
      - ".github/workflows/build-images.yml"
  workflow_dispatch: # GitHub 화면의 Actions 탭에서 손으로 실행할 수도 있게

permissions:
  contents: read
  packages: write # ghcr.io에 이미지를 올릴 권한

concurrency:
  group: build-images
  cancel-in-progress: true # 연달아 푸시하면 마지막 것만 빌드

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
            build_args: ""
          - name: web
            context: ./web
            build_args: BACKEND_URL=http://backend:8000
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 태그 2개: latest(항상 최신) + 커밋 번호 앞 7자리(되돌리기용)
      - id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sogetiong-${{ matrix.name }}"
          echo "list=${IMAGE}:latest,${IMAGE}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64 # GCP e2-micro는 x86(amd64)
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
